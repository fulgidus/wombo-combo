name: Docs

# Builds the Astro + Starlight site in docs/ and deploys it to GitHub Pages
# (https://fulgidus.github.io/wombo-combo/).
#
# One-time repo setup: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions". Without it the deploy job fails.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/gen-*"
      - "src/lib/schema.ts"
      - "src/lib/schema-types.ts"
      - "src/lib/citty-*.ts"
      - "src/commands/citty/**"
      - "schemas/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Install CLI dependencies (the generators import the command registry)
        run: bun install --frozen-lockfile

      - name: Regenerate command and config reference
        run: bun run docs:gen

      - name: Install docs dependencies
        working-directory: docs
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: docs
        run: bun run build

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
