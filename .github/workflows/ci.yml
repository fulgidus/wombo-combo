name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, build, unit + CLI/TUI e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Non-interactive defaults for CLI/TUI subprocess tests
      CI: "1"
      FORCE_COLOR: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned: test-runner fixtures and output parsing track Bun's format
          bun-version: "1.4.2"

      - name: Setup Node (runs the built CLI under node)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Configure git identity (tests create commits/worktrees)
        run: |
          git config --global user.name "wombo-ci"
          git config --global user.email "ci@wombo-combo.invalid"
          git config --global init.defaultBranch main

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        # Built before tests so e2e smoke tests also exercise dist/index.js
        run: bun run build

      - name: Unit and component tests (incl. Ink TUI components)
        run: bun test --timeout 30000 --path-ignore-patterns 'tests/e2e/**'

      - name: CLI e2e smoke tests
        run: bun test --timeout 60000 tests/e2e/cli-smoke.test.ts

      - name: TUI e2e smoke tests (real TUI in a pseudo-terminal)
        run: bun test --timeout 60000 tests/e2e/tui-smoke.test.ts

  graph:
    name: Knowledge graph is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure git identity (the hook commits a refresh when stale)
        run: |
          git config --global user.name "wombo-ci"
          git config --global user.email "ci@wombo-combo.invalid"

      # Same prek hook as the local pre-push (.pre-commit-config.yaml), so the
      # graphify version and logic have a single source of truth. The hook
      # fails when `graphify update .` changes anything under graphify-out/.
      - name: graphify-out/ matches the code
        run: |
          if ! pipx run prek run --stage pre-push graphify-update; then
            echo "::error title=Stale knowledge graph::graphify-out/ is out of date. Run 'graphify update .' and commit, or install the pre-push hook once per clone: uvx prek install"
            echo "Files the refresh would change:"
            git show --stat --format= HEAD | head -40
            exit 1
          fi

  docs:
    name: Docs reference is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The command and config reference pages are generated from
      # COMMAND_REGISTRY and schemas/config.schema.json. Regenerate and fail on
      # any difference (modified, deleted or new files under docs/).
      - name: docs/ reference matches the code
        run: |
          bun run docs:gen
          if [ -n "$(git status --porcelain -- docs)" ]; then
            echo "::error title=Stale docs reference::The generated reference under docs/ is out of date. Run 'bun run docs:gen' and commit the result."
            git status --short -- docs
            git diff --stat -- docs
            exit 1
          fi
