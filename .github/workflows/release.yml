name: Release

on:
  push:
    tags:
      - "v*"
  # Manual release from the Actions tab (or API): creates the v<version> tag
  # for the current commit, then runs the same release steps.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (must equal package.json version, e.g. 0.5.0)"
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for changelog generation

      - name: Resolve release tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=v${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2" # keep in sync with ci.yml

      - name: Setup Node (for npm publish)
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify version matches tag
        run: |
          TAG="${RELEASE_TAG#v}"
          PKG_VERSION="$(bun -e "console.log(require('./package.json').version)")"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Tag v${TAG} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi
          echo "Version verified: v${TAG}"

      - name: Typecheck
        run: bun run typecheck

      - name: Configure git identity (tests create commits/worktrees)
        run: |
          git config --global user.name "wombo-ci"
          git config --global user.email "ci@wombo-combo.invalid"

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Create release tag (manual release)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "$RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - name: Generate changelog
        id: changelog
        run: |
          # Find the previous tag
          PREV_TAG=$(git tag --sort=-version:refname | grep '^v' | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            # First release — use all commits
            CHANGELOG=$(git log --oneline --no-decorate)
          else
            CHANGELOG=$(git log --oneline --no-decorate "${PREV_TAG}..HEAD")
          fi

          # Write to file for the release body
          {
            echo "## What's Changed"
            echo ""
            echo "$CHANGELOG" | while IFS= read -r line; do
              echo "- ${line}"
            done
            echo ""
            echo "---"
            echo ""
            echo "### Install"
            echo ""
            echo "From npm:"
            echo ""
            echo '```sh'
            echo "npm install -g wombo-combo"
            echo '```'
            echo ""
            echo "From GitHub (bun):"
            echo ""
            echo '```sh'
            echo "bun add -g github:fulgidus/wombo-combo"
            echo '```'
            echo ""
            echo "Or pin to this version:"
            echo ""
            echo '```sh'
            echo "npm install -g wombo-combo@${RELEASE_TAG#v}"
            echo "bun add -g github:fulgidus/wombo-combo#${RELEASE_TAG}"
            echo '```'
          } > RELEASE_BODY.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --notes-file RELEASE_BODY.md \
            dist/index.js dist/daemon/daemon.js

      - name: Publish to npm
        run: npm publish --access public
