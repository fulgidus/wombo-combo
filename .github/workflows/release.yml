name: Release

on:
  push:
    tags:
      - "v*"
    # Continuous delivery: a version bump in package.json on main releases
    # that version (skipped when its tag already exists). To retry a release
    # that failed before its tag was created, push any edit to this file (or
    # to package.json); the plan job releases the version if it has no tag.
    branches:
      - main
    paths:
      - package.json
      - .github/workflows/release.yml
  # Manual release from the Actions tab (or API): creates the v<version> tag
  # for the current commit, then runs the same release steps.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (must equal package.json version, e.g. 0.5.0)"
        required: true

# Never run two releases at once (e.g. a bump and a tag push together)
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      release: ${{ steps.resolve.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve release tag
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="v${{ inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # A branch push or manual run must not re-release an existing tag
          if [ "${{ github.ref_type }}" != "tag" ] && git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for changelog generation

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2" # keep in sync with ci.yml

      - name: Setup Node (for npm publish)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          # Privileged job (id-token/contents write): no dependency cache, as
          # recommended by setup-node for workflows that publish
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify version matches tag
        run: |
          TAG="${RELEASE_TAG#v}"
          PKG_VERSION="$(bun -e "console.log(require('./package.json').version)")"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Tag v${TAG} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi
          echo "Version verified: v${TAG}"

      - name: Typecheck
        run: bun run typecheck

      - name: Configure git identity (tests create commits/worktrees)
        run: |
          git config --global user.name "wombo-ci"
          git config --global user.email "ci@wombo-combo.invalid"

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Create release tag (branch push or manual release)
        if: github.ref_type != 'tag'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "$RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - name: Generate changelog
        id: changelog
        run: |
          # Find the previous tag
          PREV_TAG=$(git tag --sort=-version:refname | grep '^v' | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            # First release — use all commits
            CHANGELOG=$(git log --oneline --no-decorate)
          else
            CHANGELOG=$(git log --oneline --no-decorate "${PREV_TAG}..HEAD")
          fi

          # Write to file for the release body
          {
            echo "## What's Changed"
            echo ""
            echo "$CHANGELOG" | while IFS= read -r line; do
              echo "- ${line}"
            done
            echo ""
            echo "---"
            echo ""
            echo "### Install"
            echo ""
            echo "From npm:"
            echo ""
            echo '```sh'
            echo "npm install -g wombo-combo"
            echo '```'
            echo ""
            echo "From GitHub (bun):"
            echo ""
            echo '```sh'
            echo "bun add -g github:fulgidus/wombo-combo"
            echo '```'
            echo ""
            echo "Or pin to this version:"
            echo ""
            echo '```sh'
            echo "npm install -g wombo-combo@${RELEASE_TAG#v}"
            echo "bun add -g github:fulgidus/wombo-combo#${RELEASE_TAG}"
            echo '```'
          } > RELEASE_BODY.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --notes-file RELEASE_BODY.md \
            dist/index.js dist/daemon/daemon.js

      - name: Publish to npm
        run: npm publish --access public
