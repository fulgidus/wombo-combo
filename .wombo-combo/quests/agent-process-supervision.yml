id: agent-process-supervision
title: Supervised Agent Processes
goal: |
  Make each agent's lifecycle a supervised child. Today
  src/daemon/agent-runner.ts (about 2.4k lines) mixes launch, monitoring,
  verification, merge and counter-based retries.
  - Split it along lifecycle stages (spawn/monitor, verify, merge,
    conflict resolution, review) into focused modules.
  - Replace the ad hoc retries/maxRetries counters with a transient
    restart policy from supervisor-core.
  - Worktree cleanup and process kill become the child's shutdown hook.
  - Preserve the existing retry semantics and the config.defaults.maxRetries
    meaning.
  - Retry feedback (verifier findings handed to the next attempt) must
    survive restarts.
  Acceptance: the existing agent-runner and daemon tests pass unchanged.
  New tests cover crash, hang, and exhausted restart intensity ending in a
  failed agent state.
status: active
priority: medium
difficulty: very_hard
depends_on:
  - supervisor-core
branch: quest/agent-process-supervision
baseBranch: main
hitlMode: cautious
constraints:
  add:
    - Keep the AgentStatus state machine and the protocol Evt*/Cmd* messages backward compatible
    - Refactor in behaviour-preserving steps; keep tests green after each
    - Add tests with the fake agent runner for crash and restart paths
  ban:
    - Do not change the WebSocket protocol shapes in this quest
    - Do not leave orphaned worktrees or branches when an agent is shut down
    - Do not drop the merge, verify or tiered conflict-resolution behaviour
  override: {}
