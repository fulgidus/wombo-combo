id: github-sync
title: Bidirectional woco <-> GitHub Issues sync (manual and auto)
goal: Keep woco tasks, quests and comments in lockstep with GitHub Issues, in both directions, so several people can
  work on one project at the same time (woco-first dogfooding with GitHub as visible mirror and fallback). Idempotent
  (marker-based), conflict-safe (three-way via last-synced hash, never lose data), auto-creates missing labels, works
  from a local clone (gh token or GITHUB_TOKEN) and in cloud sessions, with a manual mode and an auto mode
  (write-through hooks plus periodic daemon/watch loop).
