id: supervisor-core
title: Supervisor Core Library
goal: |
  Implement a small, dependency-free supervision library in
  src/daemon/supervision/ (or src/lib/supervision/):
  - ChildSpec: id, start(), restart type (permanent / transient /
    temporary), shutdown timeout.
  - Supervisor: manages children and applies restart strategies
    (one_for_one, one_for_all, rest_for_one).
  - Restart intensity: max N restarts per T seconds, then the supervisor
    gives up and escalates to its parent.
  - Backoff between restarts.
  - Ordered, timeout-bounded shutdown.
  - Typed event emitter for child_started, child_exited, child_restarted
    and supervisor_escalated.
  Fully unit-tested with deterministic fake clocks. The library knows
  nothing about agents or git.
  Acceptance: all strategies and the intensity escalation have tests, and
  typecheck and build pass.
status: active
priority: medium
difficulty: hard
depends_on:
  - otp-supervision-spike
branch: quest/supervisor-core
baseBranch: main
hitlMode: yolo
constraints:
  add:
    - Pure TypeScript, ESM, extensionless relative imports
    - Inject clock and timers so tests are deterministic
    - Keep each module under ~500 lines
    - Tests go in tests/*.test.ts
  ban:
    - Do not import from agent-runner, scheduler or any git/worktree code
    - Do not add dependencies
    - Do not change existing daemon behaviour in this quest
  override: {}
