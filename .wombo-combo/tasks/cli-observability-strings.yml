id: cli-observability-strings
title: Extract logs, history, usage and replay messages
description: |
  Route human text-mode messages of the observability CLI commands through t() with
  keys in cli-observability.json.

  Files owned by this task:
  - src/commands/logs.ts (about 22 console calls)
  - src/commands/history.ts (about 34)
  - src/commands/usage.ts (about 31)
  - src/commands/citty/usage.ts
  - src/commands/stats.ts (about 9)
  - src/commands/eval.ts (about 15)
  - src/commands/replay.ts (about 15)
  - Colocated or tests/ tests for these commands that assert on text output
  - src/locales/en/cli-observability.json

  Rules: translate only the text-mode output branch. Never translate JSON/TOON output,
  IDs, model names, token counts, metric keys, file paths, log content, or citty help text.
  Use t() from src/lib/i18n.ts. Plural keys for counts.

  Work:
  1. Keep English identical for every key.
  2. Typecheck, build, bun test, `graphify update .`.
