id: obs-dashboard-metrics
title: Extend Dashboard Metrics For Supervision
description: |
  Extend src/lib/dashboard-metrics.ts so applySnapshot and applyDashboardEvent handle the new
  events. Add an optional `supervision: SupervisionTreeSnapshot` field to the dashboard state
  (initial value from emptySupervisionTree) and add the four evt:* supervision types plus
  evt:supervision-tree to the DashboardEvent union; route them through applySupervisionEvent in
  applyDashboardEvent. applySnapshot must preserve the supervision field untouched (state
  snapshots carry no tree). Add the matching event subscriptions in
  src/ink/dashboard-provider.tsx (the event loop around line 220), and send
  cmd:get-supervision-tree on connect/reconnect so the tree is seeded. Expose the tree through
  DashboardMetricsValue in src/ink/dashboard-metrics-context.tsx.
  Extend existing dashboard-metrics tests (find them with grep for applyDashboardEvent in tests/ and
  src/) with cases for every new event and for snapshot preservation.
