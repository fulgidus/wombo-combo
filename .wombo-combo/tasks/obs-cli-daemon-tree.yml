id: obs-cli-daemon-tree
title: Add woco daemon tree Command
description: |
  Add a `tree` subcommand to src/commands/citty/daemon.ts. It connects to the running daemon
  through the existing client/launcher helpers, sends cmd:get-supervision-tree, and prints the
  reply. Default text output uses formatSupervisionTree; `--output json` (and toon, via the
  existing resolveOutputFormat/output helpers) prints a compact JSON object
  {root, totalRestarts, escalations, updatedAt}. When the daemon is not running, print a localised
  message (text) or {running:false, root:null} (json) and exit non-zero only if the existing
  daemon status command does so for the same case.
  Register the subcommand in src/commands/citty/router.ts if subcommands are listed there and in
  COMMAND_REGISTRY (src/lib/schema.ts; also check src/lib/citty-registry.ts) so `woco describe`
  lists `daemon tree` with its flags. Add CLI strings to src/locales/en/cli.json (and it/cli.json if
  parity is required); no hardcoded text.
  Tests: tests/daemon-tree-cli.test.ts covering JSON shape against a fake WebSocket daemon or a
  stubbed fetch function (reuse patterns in tests/daemon-client.test.ts), the not-running case,
  and a describe-registry assertion.
