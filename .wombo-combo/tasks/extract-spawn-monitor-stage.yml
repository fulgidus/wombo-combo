id: extract-spawn-monitor-stage
title: Extract Spawn and Monitor Stage
description: |
  Move launch and monitoring out of agent-runner.ts into
  src/daemon/runner/spawn-monitor.ts: doLaunch, buildCallbacks, handleRetry
  (as the "relaunch" operation), registerUsageContext, selectRoute and
  route helpers, plus the staggered launch queue
  (enqueueLaunch/processLaunchQueue) if cleanly separable. Keep
  AgentRunner as a thin facade with the same public API (launchAgent,
  setAgentOverride, setAutoPush, setMaxRetries, cancelAgent, killAll,
  reapDeadProcesses, reconcile*, restoreAnalytics, interruptAnalytics,
  destroy), since daemon.ts, scheduler.ts and the tests use it.
  After this task agent-runner.ts should be a composition root of roughly
  500 lines or fewer. Pure move; no semantics changes. Isolate the
  monitor-failure retry branch (the onError retry/fail logic) as one
  function onProcessFailed(featureId, error) next to its sibling
  onVerifyFailed so both can be replaced by the restart policy in a single
  follow-up.
