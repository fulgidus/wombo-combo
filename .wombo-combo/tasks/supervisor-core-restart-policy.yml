id: supervisor-core-restart-policy
title: Add supervisor-core Restart Policy
description: |
  supervisor-core does not exist in the repo (grep finds nothing), so create
  it: src/lib/supervisor-core.ts, a pure, dependency-free module with no
  daemon/state imports.

  Provide:
  - type RestartPolicy = "transient" (restart only on abnormal exit;
    normal completion never restarts). Keep it extensible ("permanent" |
    "temporary" may be typed but only transient needs implementing).
  - type ExitReason = { kind: "normal" } | { kind: "crash"; error: string }
    | { kind: "hang"; idleMs: number } | { kind: "verify-failed"; error: string }.
  - Restart intensity: createRestartTracker({ maxRestarts, now? }) with
    decide(reason) -> { action: "restart"; attempt: number; max: number } |
    { action: "stop-normal" } | { action: "give-up"; reason: "intensity" }.
    maxRestarts == the existing config.defaults.maxRetries meaning: an agent
    may be restarted at most maxRestarts times after its first attempt, so
    decide() on the (maxRestarts+1)th abnormal exit gives up. The tracker
    counts restarts, not time windows (no sliding window, to preserve
    counter semantics exactly); accept an initial restart count so a
    tracker can be rehydrated from agent.retries.
  - ChildSpec/SupervisedChild: { id, policy, start(), shutdown() } with an
    idempotent shutdown hook (runs once, errors swallowed and reported to an
    onShutdownError callback) and a stop() that invokes it.
  Add tests/supervisor-core.test.ts covering: transient normal exit never
  restarts, crash restarts up to maxRestarts then gives up, maxRestarts 0
  gives up immediately, rehydration from an initial count, shutdown hook runs
  once and is idempotent, shutdown error is contained.
