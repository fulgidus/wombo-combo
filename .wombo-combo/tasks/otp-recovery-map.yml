id: otp-recovery-map
title: Map Current Ad Hoc Recovery
description: |
  Write docs/adr/0001-otp-supervision/recovery-map.md: an inventory of every place the daemon
  recovers from failure today, and for each, the OTP supervision primitive that would replace it.

  Read src/daemon/agent-runner.ts, scheduler.ts, state.ts and daemon.ts first. Cover at least:
  - agent-runner.ts: the onError retry path (agent.retries < agent.maxRetries, then
    cancelDownstream + rescueChainPredecessors), the build-verification retry path, the
    handleRetry session-reuse vs re-queue branch (and its baseline gate), and the tiered
    merge-conflict escalation (tiers 1 to 4).
  - agent-runner.ts reconcileOrphanedTasks (in_progress task with no agent -> planned) and the
    startup reconciliation of "completed", "verified" and "resolving_conflict" agents.
  - daemon.ts: how startup calls reconcile, and any stale-agent / PID-only recovery
    (isProcessRunning, pid-utils.ts).
  - scheduler.ts: how queued agents are re-picked each tick, pinned tasks, concurrency pinning.
  - config.defaults.maxRetries and the setMaxRetries session override.
  For each entry give: file and function, trigger, current behaviour, state it mutates, the
  replacing primitive (restart type, restart strategy, intensity/period, shutdown, link/monitor,
  or "stays as-is, not a supervision concern") and any behaviour gap. Use a table plus short notes.
  Use wombo vocabulary: task, quest, wave, agent, harness.
