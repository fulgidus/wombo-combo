id: otp-supervisor-prototype
title: Prototype Supervisor Core
description: |
  Build a throwaway supervisor core in spikes/otp-supervision/supervisor.ts (new directory outside
  src/). It must not import from or modify the daemon's behaviour; it may import types from
  src/lib/fake-agent-runner.ts if useful.

  Implement: ChildSpec { id, start: () => Promise<void> (resolves = normal exit, rejects = crash),
  restart: "permanent" | "transient" | "temporary", shutdownMs }, a Supervisor with strategy
  "one_for_one" | "one_for_all" | "rest_for_one", maxRestarts / periodMs restart intensity, child
  ordering, ordered shutdown with timeout (AbortSignal passed to start), and escalation: when
  intensity is exceeded the supervisor terminates its children and fires an onEscalate callback
  (or crashes up to a parent Supervisor, which is itself a valid child). Take injectable
  clock/timers so tests are deterministic. Emit structured events (child_started, child_exit,
  child_restarted, intensity_exceeded, escalated) through an onEvent callback.
  Keep it under about 250 lines. Add spikes/otp-supervision/README.md stating it is a throwaway,
  how to run the demo and tests, and that it is not wired into the daemon.
