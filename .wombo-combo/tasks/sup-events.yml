id: sup-events
title: Typed Supervisor Event Emitter
description: >
  Create src/lib/supervision/events.ts: a tiny dependency-free typed emitter.
    - class TypedEmitter<M extends Record<string, unknown>> with on<K>(event, listener): () => void (returns unsubscribe), once<K>(...), off<K>(...), emit<K>(event, payload): void, listenerCount(event).
    - A listener that throws must not break other listeners or the emitter: catch the error and continue (collect and ignore; optionally accept an onListenerError callback in the constructor).
    - Listeners removed during emit must not be skipped or double-called (iterate over a copy).
    - export type SupervisorEmitter = TypedEmitter<SupervisorEvents> (SupervisorEvents from ./types).
  Add tests/supervision-events.test.ts: subscribe/unsubscribe, once, throwing listener isolation, removal during emit,
  payload typing (use satisfies / type assertions compiled by typecheck).
