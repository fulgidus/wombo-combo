id: cli-meta-strings
title: Extract upgrade, completion and init messages; wire CLI locale
description: |
  Route human text-mode messages of the remaining CLI commands through t() with keys in
  cli-meta.json, and initialize the CLI locale at process start.

  Files owned by this task:
  - src/commands/upgrade.ts (about 46 console calls)
  - src/commands/completion.ts (about 25)
  - src/commands/init.ts
  - src/commands/citty/describe.ts, src/commands/citty/help.ts, src/commands/citty/version.ts
    (do NOT translate their descriptions or machine output; only human messages if any)
  - src/index.ts: call initI18n(resolveLocale(env-based)) once at startup, before routing.
    Do not load config here just for locale; env-based detection is the CLI default.
    The TUI applies the configured locale separately.
  - Colocated or tests/ tests for these files that assert on text
  - src/locales/en/cli-meta.json

  Rules:
  - Translate only the text-mode human output. Shell completion scripts generated by
    `woco completion` are machine-facing: do NOT translate them.
  - Never translate JSON/TOON output, version strings, or command names.
  - Plural keys for counts.

  Work:
  1. Keep English identical for every key.
  2. Verify `bun dev completion bash` output is unchanged byte-for-byte.
  3. Typecheck, build, bun test, `graphify update .`.
