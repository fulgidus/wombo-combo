notes:
  - "Model it on Erlang/OTP supervisors: the supervisor owns the child list, and children report exits via their exit
    promise."
  - Await microtasks with FakeClock.advanceAsync in tests, since restart paths mix promises and timers.
  - Group restarts (one_for_all, rest_for_one) are implemented here via planRestart; they get dedicated, exhaustive
    tests in the next task.
