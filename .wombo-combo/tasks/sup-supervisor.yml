constraints:
  - All time through the injected Clock; randomness through injected random
  - Child modelled as abortable handle with an exit promise carrying normal | shutdown | crash(error) (ExitReason)
  - snapshot() must be a plain serializable object and must not mutate state
  - Never leave unhandled promise rejections; a throwing event listener must not break supervision
  - Keep each module under ~500 lines (split into child-state.ts if needed)
