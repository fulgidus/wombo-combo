constraints:
  - Keep English output byte-identical for every existing key so no existing test assertion changes
  - Engine module src/lib/i18n.ts must not import React or Ink
  - Keep the exported t signature (key, vars?) compatible so unmigrated callers still compile
  - Use nsSeparator false; keys are plain dot-notation, namespaces are found via fallbackNS
  - Interpolation must not HTML-escape values
  - Locale JSON must be statically imported so the bundle includes it
  - Create every namespace file listed in the description, even if empty
forbidden:
  - Do not add a language-detection package; implement detection in src/lib/i18n.ts
  - Do not edit any TUI component or CLI command file beyond what is needed to keep imports compiling
  - Do not change src/config.ts, schemas/, or docs/ (owned by another task)
  - Do not add locales other than en
  - Do not use --no-verify or force push
references:
  - src/ink/i18n.ts
  - src/ink/strings/en.ts
  - tests/ink/i18n.test.ts
  - src/ink/index.ts
  - package.json
  - src/lib/output.ts
notes:
  - "i18next is a new dependency: the quest explicitly requests it, so justify it in the commit body as described"
  - The existing t() is used at module scope in several files (e.g. settings-screen.tsx builds a field array at import
    time); those will be fixed by the migration tasks, so keep t() working at import time with the English default
  - i18next v23+ plural suffixes for en are _one and _other
