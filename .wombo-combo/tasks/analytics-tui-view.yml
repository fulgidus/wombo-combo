id: analytics-tui-view
title: Render Aggregated Analytics In Ink
description: |
  Create src/ink/analytics-overlay.tsx with a declarative Modal-based
  AnalyticsOverlayView accepting shared summaries, grouped entries,
  grouping, selection, diagnostics, and callbacks.
  Show execution outcomes, successful completion duration, full token
  totals, retries, weighted build pass rate, additions/deletions, sample
  counts, and partial or unavailable usage coverage.
  Support task, quest, wave, agent, and model grouping; Tab cycles
  grouping, arrows or j/k navigate, and Escape/u/U closes.
  Add rendering and interaction tests in analytics-overlay.test.tsx
  using existing Ink stream and renderToString patterns.
