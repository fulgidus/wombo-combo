id: extract-merge-stage
title: Extract Merge Stage, Keep Serialized
description: |
  Move the merge pipeline out of agent-runner.ts into
  src/daemon/runner/merge-stage.ts: attemptMerge, mergeIntoBase,
  handleMergeSuccess, publishAfterMerge, logPublication, evidenceFor
  (approx. L1024-1376), delegating to the conflict-resolution module from the
  previous task.

  Merge and conflict resolution mutate shared git state (the base/quest
  branch), so they must remain strictly serialized and must NOT be treated
  as freely restarting supervised siblings. Make the existing serialization
  (inspect how attemptMerge queues today) explicit: a single MergeQueue
  (promise-chain mutex) owned by the merge stage, with a small unit test
  proving two concurrent merges never overlap and a rejected merge does not
  block the next one. Behaviour otherwise unchanged (mergeBefore map,
  post-merge pipeline, auto-push).
