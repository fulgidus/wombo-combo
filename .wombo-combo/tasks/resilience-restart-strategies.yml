id: resilience-restart-strategies
title: Restart Strategy Resilience Tests
description: |
  Add tests/resilience/restart-strategies.test.ts exercising every restart strategy
  and restart type the tree uses, end to end with the fake agent and FakeClock.
  Discover the strategy used per level from the merged tree (daemon root -> wave ->
  quest -> agent) and cover each:
    - one_for_one: sibling independent tasks; one crashes (crash@before-commit), only it
      restarts, siblings keep running and complete untouched.
    - one_for_all: if any level uses it, a crash restarts all siblings in order; assert
      shutdown-then-start ordering from the event recorder.
    - rest_for_one: a quest base-branch/baseline-style child failing restarts it and
      the children started after it, not those before it; dependents are halted cleanly.
    - restart types: permanent restarts after normal exit, transient restarts only on
      crash (flaky:2@before-commit becomes healthy on the third attempt and ends merged
      or verified), temporary is never restarted (repeat-crash ends failed).
    - backoff: restarts happen only after FakeClock.advance past the backoff; assert no
      restart before and exactly one after.
    - Verifier feedback / retry state survives a restart where the agent supervisor
      promises it (see agent-process-supervision).
    - hang@after-text under a per-child timeout: advance the clock past the timeout,
      the child is killed and restarted per policy.
  Each test uses createScenario from tests/helpers/resilience-harness.ts and the
  leak assertions in dispose.
