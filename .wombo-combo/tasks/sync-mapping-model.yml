id: sync-mapping-model
title: Sync mapping store and pure render/parse functions
description: "src/lib/sync/mapping.ts + render.ts (pure, no network). Mapping store:
  .wombo-combo/sync/github/<task|quest>/<id>.yml (tracked in git, one file per item so teammates merge cleanly) with
  issue_number, issue_url, remote_updated_at, local_hash, remote_hash, last_synced_at and a comments map
  {<woco-comment-id>: <github-comment-id>}. Stable content hashing of the syncable fields. Markers: hidden HTML comments
  '<!-- woco:task:<id> -->', '<!-- woco:quest:<id> -->', '<!-- woco:comment:<id> -->' used to recognise our own content
  and make create idempotent (look up by marker before creating). Render: task -> issue {title '[id] title', body
  (description, constraints, forbidden, references, depends_on as 'Blocked by' text, marker), labels (priority:*,
  difficulty:*, quest:<id>, triage role from notes 'triage: <label>'), state (done -> closed completed, cancelled ->
  closed not_planned, else open)}; quest -> issue labelled spec; woco comment -> GitHub comment body with attribution
  line and marker. Parse: issue -> task fields (reverse), GitHub comment -> woco comment fields; round-trip tests.
  Three-way merge helper mergeFields(base, local, remote) returning merged fields plus conflicts (field changed on both
  sides to different values). Document the policy in code: local wins on conflict, a conflict is reported and never
  silently lost."
