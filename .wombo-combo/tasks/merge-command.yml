ended_at: null
constraints:
  - Dry-run must not write state, merge, create worktrees, commit, push, or invoke gh.
  - Use persisted verification evidence; absent test evidence is unknown.
  - Do not merge deferred chain predecessors separately.
  - Detect already-merged/no-change branches and avoid duplicate publication.
  - Machine-readable output must remain valid when merger helpers print diagnostics.
  - Live-daemon refusal must include an actionable explanation.
forbidden:
  - Do not modify src/daemon/agent-runner.ts.
  - Do not resurrect removed wave-state modules or hand-written CLI parsing.
  - Do not maintain a second manual registry in src/lib/schema.ts.
