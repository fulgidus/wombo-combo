id: merge-command
title: Add Merge Command With Publication
description: |
  Implement the currently absent src/commands/merge.ts and
  src/commands/citty/merge.ts. Accept optional comma-separated --tasks IDs;
  otherwise select persisted verified, nondeferred agents. Reject selected
  unverified agents and mixed destination branches rather than guessing.
  Read DaemonState and existing task stores, refusing mutation while a live
  daemon could merge concurrently. Merge selected branches sequentially using
  enqueueMerge and existing merger APIs. Mark successfully merged records and
  tasks done using existing persistence patterns.
  Capture before/after SHAs, task metadata, and verification evidence before
  cleanup. After a completely successful batch, invoke the coordinator once.
  If any selected merge fails, preserve/report successes but do not publish
  the incomplete batch. Support --dry-run and existing text/json/toon output.
  Register merge in src/commands/citty/router.ts and src/lib/citty-registry.ts
  so help, describe, and completion discover it. Add tests/citty-merge.test.ts
  and tests/merge-command.test.ts.
status: backlog
completion: 0
difficulty: hard
priority: high
