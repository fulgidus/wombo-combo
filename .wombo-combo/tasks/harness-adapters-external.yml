id: harness-adapters-external
title: Claude Code, Codex, pi and custom command adapters
description: |
  Implement adapters for claude-code (claude -p --output-format stream-json
  --verbose, --resume), codex (codex exec --json, exec resume), pi (pi -p
  --mode json) and a generic custom command adapter (placeholder template
  with {prompt} {model} {session} {cwd}, output "text" or "opencode-jsonl").
  Each normalizer maps the CLI's JSON stream to canonical events: session
  id, tool activity (read/write/edit/bash...), text, step_finish with
  reason stop and token usage, and error events. Cover with fixture-driven
  unit tests (fixtures under tests/fixtures/harness/) including partial
  lines, unknown events and failed turns. No binaries required.
