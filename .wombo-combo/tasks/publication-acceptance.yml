constraints:
  - No real GitHub PR creation, external pushes, or authentication changes during tests.
  - Acceptance tests must assert skipped and unknown tests are not reported as passed.
  - Use bun dev for local CLI checks, never a globally installed binary.
  - Build verification timeout is 300000 milliseconds.
