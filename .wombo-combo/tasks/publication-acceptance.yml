id: publication-acceptance
title: Verify And Document Publication Workflows
description: |
  Add tests/post-merge-integration.test.ts exercising the merged CLI and daemon
  integration with disposable local Git repositories, a local bare remote,
  and mocked gh execution. Verify open/draft/skip modes, commit-before-push
  ordering, one PR per head/base pair, cumulative report contents, repeat
  execution, preserved dirty checkout, partial merge failure, missing gh,
  failed pushes, and same-head/base refusal.
  Document configuration and both entry points in README.md, including the
  distinction between merge destination and PR target, independent changelog
  behavior, default skip mode, authentication prerequisites, recovery through
  rerunning merge, and continuous daemon PR updates.
  Run bun run typecheck, bun run build, bun test, and read-only bun dev merge
  --help / describe smoke checks. Record any unrelated baseline failures
  without widening this quest.
