id: sup-index-docs
title: Barrel Export, Docs and Build Check
description: >
  Create src/lib/supervision/index.ts re-exporting the public API: Supervisor, SupervisorEscalation, TypedEmitter,
  systemClock, computeBackoff, IntensityTracker, planRestart, shouldRestart, stopChild, stopChildrenInOrder, and all
  public types from types.ts.

  Add a short architecture doc docs/src/content/docs/architecture/supervision.md (Starlight frontmatter
  title/description; mirror the style of architecture/overview.md): purpose, ChildSpec/ChildHandle model, restart types,
  the three strategies, intensity and escalation, backoff, shutdown ordering, events, snapshot(), and a short usage
  example. State plainly that the library is standalone and not yet wired into the daemon. Check how
  docs/astro.config.mjs builds its sidebar; add the page there only if the sidebar is explicit, otherwise rely on
  autogeneration.

  Add tests/supervision-index.test.ts: a smoke test importing only from src/lib/supervision (the barrel) that builds a
  Supervisor with a FakeClock-driven child and verifies a crash is restarted.

  Run `bun run typecheck`, `bun run build` and `bun test tests/supervision*.test.ts tests/supervisor*.test.ts
  tests/fake-clock.test.ts` and fix barrel/type problems you introduced. Then run `graphify update .` (project rule).
