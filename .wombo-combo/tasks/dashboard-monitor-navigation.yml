id: dashboard-monitor-navigation
title: Wire dashboard into standalone monitor
description: |
  Update DaemonMonitorShell in src/ink/run-daemon-monitor.tsx to mount
  DashboardMetricsProvider once for its existing caller-owned client.
  Register DashboardScreen alongside splash, monitor, and settings.
  Connect the new ESC-menu dashboard callback and chrome availability
  flag, and update the chrome title on screen changes.

  Push dashboard from the monitor and return with pop(), avoiding
  duplicate dashboard stack entries. Retain the existing notifyRef,
  DashboardStoreContext, HITL state, and monitor event-handling paths.
  Extend tests/ink/monitor-router.test.tsx with dashboard navigation.
