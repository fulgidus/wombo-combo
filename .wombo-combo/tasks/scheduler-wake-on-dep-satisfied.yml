id: scheduler-wake-on-dep-satisfied
title: Scheduler idles when deps become satisfied via daemon state only
description: "Found by dogfooding: when all agents finish and the only newly launchable tasks (e.g. triage-docs,
  review-docs) became ready because a dependency reached verified/merged in daemon state (not on disk), the scheduler
  has cleared its tick timer (src/daemon/scheduler.ts, idle branch near line 300) and never re-evaluates: log shows 0
  active, 0 queued while planned tasks with satisfied deps wait. Fix: re-arm the tick (or run a candidate pass) whenever
  an agent changes status to verified/merged/failed, in addition to the tasks-directory watcher. Add a scheduler test
  that reproduces it."
