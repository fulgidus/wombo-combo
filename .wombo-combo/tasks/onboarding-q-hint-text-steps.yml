id: onboarding-q-hint-text-steps
title: Chrome q hint is misleading on onboarding text steps
description: On the first-run onboarding wizard, q quits only on the selection step; on text-input steps it types a
  letter. The global bottom chrome still advertises "q quit" on every screen, so text steps show a misleading hint. Fix
  by letting the active screen suppress the q quit hint, leaving other screens unchanged.
