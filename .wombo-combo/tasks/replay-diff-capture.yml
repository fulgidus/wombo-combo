id: replay-diff-capture
title: Bounded worktree diff capture
description: |
  Create src/lib/replay-diff.ts: captureWorktreeDiff(worktree, baselineHead)
  returns a bounded unified diff (git diff baseline, excluding runtime
  paths via isExcludedPath), a file stat summary and truncated flag;
  never throws, returns diagnostics. Include helpers to classify diff
  lines (add/del/hunk/meta) for the viewer.
