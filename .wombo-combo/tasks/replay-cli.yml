id: replay-cli
title: woco replay list/show command
description: |
  Add `woco replay list` and `woco replay show <feature-id> [--execution N]
  [--output json]` as a citty parent command with subcommands, route it in
  router.ts, and register it in citty-registry.ts so `woco describe replay`
  works. Text output summarises executions and prints a readable timeline;
  json/toon output returns the structured replay.
status: backlog
completion: 0
difficulty: medium
priority: medium
depends_on:
  - replay-format-store
effort: PT1H30M
started_at: null
ended_at: null
constraints:
  - Follow the wishlist/usage command patterns (ensureInitialized, resolveOutputFormat, output helpers).
  - --execution is a 1-based index into the feature's executions ordered oldest to newest (default latest); a full
    execution id is also accepted.
  - Unknown feature or execution exits non-zero with a clear message.
forbidden:
  - Do not read or write daemon state.
references:
  - src/commands/citty/wishlist.ts
  - src/commands/citty/usage.ts
  - src/lib/citty-registry.ts
notes:
  - Registry parity tests (src/lib/registry-parity.test.ts, citty-registry.test.ts) must stay green.
