id: wire-transient-restart-policy
title: Wire Restart Policy Into Runner
description: |
  Replace the ad hoc `agent.retries < agent.maxRetries` branches in
  onProcessFailed (monitor failure) and onVerifyFailed (build failure) with
  the supervisor-core transient restart policy. Build a tracker per agent
  (rehydrated from agent.retries so a daemon restart or user retry keeps the
  count; drop it when the agent ends) and map outcomes:
  - decide() -> restart: set retries/error and status "retry" with the SAME
    messages as before ("Retry N/M: err", "Build failed, retry N/M"), then
    relaunch via the existing relaunch path.
  - decide() -> give-up: status "failed" with the same messages ("<error>",
    "Build failed, retries exhausted"), cancelDownstream,
    rescueChainPredecessors.
  - normal exit: no restart (verification follows as today).
  agent.retries and agent.maxRetries stay the persisted, observable fields
  (state.ts, protocol, TUI), and maxRetries keeps the
  config.defaults.maxRetries / setMaxRetries meaning. Also route the
  reapDeadProcesses "retry" safety net and DaemonState.retryAgent's bound
  check through the same decision helper so there is exactly one place that
  decides "may this agent be restarted". Review-gate sends-back-to-agent and
  merge/conflict flows are NOT restarts and must not go through the policy.
  The characterization suite from the first task must pass unchanged.
