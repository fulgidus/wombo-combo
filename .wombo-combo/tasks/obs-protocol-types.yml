id: obs-protocol-types
title: Add Supervision Protocol Messages
description: >
  Extend src/daemon/protocol.ts with additive supervision messages. Do not change any

  existing Evt*/Cmd* shape and do not bump PROTOCOL_VERSION.


  Add shared types:
    - SupervisionChildKind = "supervisor" | "agent" (string-literal union, extensible).
    - SupervisionExitReason { kind: "normal" | "crash" | "killed" | "timeout" | "shutdown" | "intensity_exceeded"; message?: string; code?: number }.
    - SupervisionNode { id, label, kind, strategy?, state: "starting"|"running"|"restarting"|"stopped"|"failed", restartCount, lastExit?: SupervisionExitReason, lastExitAt?: string (ISO), children: SupervisionNode[] }.
    - SupervisionTreeSnapshot { root: SupervisionNode | null; updatedAt: string; totalRestarts: number; escalations: number }.

  Add events (all payload interfaces exported):
    - EvtSupervisorStarted { supervisorId, parentId?, strategy?, label? }
    - EvtChildRestarted { supervisorId, childId, restartCount, reason: SupervisionExitReason, delayMs?, at }
    - EvtIntensityExceeded { supervisorId, maxRestarts, windowMs, restarts, at }
    - EvtSupervisorEscalated { supervisorId, parentId?, outcome?: string, reason: SupervisionExitReason, at }
    - EvtSupervisionTree { tree: SupervisionTreeSnapshot }  (reply to the new command)
  Add command CmdGetSupervisionTree {} ("cmd:get-supervision-tree").

  Register them in CommandMap / EventMap under names "evt:supervisor-started", "evt:child-restarted",

  "evt:intensity-exceeded", "evt:supervisor-escalated", "evt:supervision-tree",

  "cmd:get-supervision-tree". Update any exhaustive lists/type guards (grep for the event-name unions,

  e.g. DashboardEvent in src/lib/dashboard-metrics.ts is handled by a later task, not here).

  Older clients must ignore unknown events: verify src/daemon/client.ts does not throw on unknown

  event types, and add a test.

  Extend tests/daemon-protocol.test.ts with round-trip and backward-compat cases.
