constraints:
  - Skip mode must require neither GitHub CLI nor remote publication.
  - Changelog generation is independent of PR mode.
  - Validate enum values, booleans, and nonempty explicitly configured PR target branches.
  - Shared types must not import command or daemon runtime modules.
forbidden:
  - Do not modify merge execution, daemon scheduling, or tracked project configuration.
  - Do not add dependencies.
references:
  - src/config.ts
  - schemas/config.schema.json
  - tests/config.test.ts
  - src/lib/verifier.ts
  - src/lib/tdd-verifier.ts
  - .gitignore
notes:
  - Export a normalization helper so legacy callers need not supply the new block.
  - Use optional verification fields to preserve older persisted state compatibility.
