id: post-merge-contract
title: Define Post Merge Configuration Contracts
description: |
  Add PostMergeConfig and its defaults, normalization, and validation in
  src/config.ts. Configuration: postMerge.prMode = open | draft | skip
  (default skip), postMerge.prBaseBranch = string | null (default null,
  meaning the configured remote's default branch), and
  postMerge.changelog = boolean (default true).
  Keep older config files and manually constructed configurations compatible.
  Update schemas/config.schema.json and tests/config.test.ts.
  Create src/lib/post-merge-types.ts defining compact VerificationSummary,
  MergeReportInput, MergeReport, and PostMergeResult contracts. Report inputs
  include destination branch, before/after commit SHAs, task IDs/titles,
  verification summaries, and a stable operation ID. Results distinguish
  changelog, push, and PR outcomes without changing merge success.
  Ignore .wombo-combo/post-merge.json and its temporary files in .gitignore.
status: backlog
