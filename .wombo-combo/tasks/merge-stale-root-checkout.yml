id: merge-stale-root-checkout
title: After merging, bring the project root checkout of the base branch up to date
description: "Found by dogfooding: src/lib/merger.ts merges in a temporary worktree of the base branch (deliberately, to
  avoid disturbing the project root). When the base branch (main) is also checked out in the project root, its ref moves
  but the root's index and working tree stay at the old commit, so 'git status' shows the merged changes reversed
  (staged deletions and modifications) and a later 'git commit' or 'git add -A' there would silently revert the merges.
  Fix: after a successful merge, if the project root has the base branch checked out, update its index and working tree
  with 'git read-tree -m -u <oldTip> <newTip>' (two-way merge that keeps local uncommitted changes and fails safely on
  conflicts); on failure leave it untouched and print a clear warning with the exact command to run. Add tests with real
  git repos (tests/helpers/git-repo.ts): clean root is updated, root with unrelated local changes keeps them, root with
  conflicting local changes is left alone with a warning."
