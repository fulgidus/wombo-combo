id: tui-wizard-strings
title: Extract quest, errand and task wizard strings
description: |
  Move user-facing strings in the creation and review wizards into the
  tui-wizards.json namespace and switch the components to useI18n().

  Files owned by this task:
  - src/ink/quest-wizard.tsx, src/ink/run-quest-wizard.tsx
  - src/ink/errand-wizard.tsx, src/ink/run-errand-wizard.tsx
  - src/ink/fake-task-wizard.tsx
  - src/ink/genesis-review.tsx
  - src/ink/plan-review.tsx
  - src/ink/task-editor.tsx
  - src/ink/init-form.tsx, src/ink/init-app.tsx
  - Colocated tests for these files, e.g. quest-wizard.test.tsx, errand-wizard.test.tsx,
    genesis-review.test.tsx, plan-review.test.tsx, init-form.test.tsx, init-app.test.tsx,
    run-quest-wizard.test.tsx.
  - src/locales/en/tui-wizards.json

  Work:
  1. Replace each hardcoded English label, hint, placeholder, validation error and
     button text with t() keys from tui-wizards.json, read via useI18n() inside
     components. Keys use the prefix that matches the file, e.g. "questWizard.title".
  2. Where a helper builds display text outside React components, pass the t function
     in as a parameter rather than importing the global t.
  3. Keep English text identical so existing assertions still pass; update a test only
     when a key was intentionally renamed in the same commit.
  4. Typecheck, build, bun test, `graphify update .`.
