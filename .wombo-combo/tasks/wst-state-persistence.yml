id: wst-state-persistence
title: Persist Supervision Snapshot and Events
description: |
  Make the tree's minimal state durable and observable.
  1. src/daemon/state.ts: add an optional `supervision?: SupervisionSnapshot`
     field to PersistedDaemonState. Do NOT bump STATE_VERSION; the field is
     optional so older files still load. Add `getSupervision()` /
     `setSupervision(snapshot)` on DaemonState; setSupervision calls the
     existing scheduleSave(). Writes must keep going through the existing
     atomic tmp-file + rename in save(). Define SupervisionSnapshot locally in
     state.ts (structurally identical to the type exported by
     wst-tree-model) so this task has no dependency on it; wst-daemon-wiring
     unifies them.
  2. src/daemon/protocol.ts: add an `evt:supervision` event
     (EvtSupervision: { event: string; questId?: string; agentId?: string;
     outcome?: string; detail?: Record<string, unknown> }) to the event map,
     without changing PROTOCOL_VERSION semantics for existing messages
     (additive only). Include `supervision` summary (waveStatus,
     pausedQuests) in the state snapshot event only if it can be done
     additively and optionally.
  3. Tests in tests/daemon-state.test.ts-style new file
     tests/daemon-state-supervision.test.ts: snapshot round trip through
     save()/load(), loading an old file without the field, atomic write leaves
     no .tmp file, protocol test addition in tests/daemon-protocol.test.ts only
     if it has an exhaustive event list.
