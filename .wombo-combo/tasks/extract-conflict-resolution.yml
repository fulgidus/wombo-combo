id: extract-conflict-resolution
title: Extract Conflict Resolution Module
description: |
  Move the tiered conflict-resolution code out of src/daemon/agent-runner.ts
  into src/daemon/runner/conflict-resolution.ts: handleMergeConflict,
  escalatingConflictResolution, runTier3, runTier35, runTier4,
  getConflictDiffs, isTierAllowed, runSafeCmd and the helpers only they use
  (approx. L136-185 and L1377-1888).

  Pure behaviour-preserving move. Design the module as functions (or a small
  class) taking an explicit context object (projectRoot, config, state,
  monitor, analytics, replay, selectRoute/conflictRoute callbacks, log) so
  AgentRunner delegates to it. AgentRunner keeps thin private wrappers where
  tests call or spy on them (check tests/daemon-agent-runner*.ts and
  tests/daemon-*.test.ts for private-member access via `as any`). No
  change to tier ordering, status transitions (resolving_conflict etc.),
  prompts or events.
