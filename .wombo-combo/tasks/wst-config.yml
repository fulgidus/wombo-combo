id: wst-config
title: Add Supervision Tree Config
description: |
  Add an optional `supervision` block to WomboConfig in src/config.ts, with
  matching entries in schemas/config.schema.json (keep the two in sync and
  extend the validator in src/config.ts). Shape:

    supervision?: {
      restartIntensity?: { maxRestarts?: number; windowMs?: number };
      backoff?: { initialMs?: number; maxMs?: number; factor?: number };
      strategy?: { wave?: "one_for_one"; quest?: "one_for_one" | "rest_for_one" };
      escalation?: {
        onBaselineFailure?: "none" | "pause_quest" | "degrade_wave" | "abort_wave";
        onBaseBranchFailure?: "none" | "pause_quest" | "degrade_wave" | "abort_wave";
        onIntensityExceeded?: "none" | "pause_quest" | "degrade_wave" | "abort_wave";
      };
    }

  Defaults (exported as DEFAULT_SUPERVISION and a `resolveSupervision(config)`
  helper that returns a fully-populated object) must reproduce today's
  behaviour exactly:
  - maxRestarts: unset resolves to config.defaults.maxRetries; windowMs 0 = no
    time window (count-based, as today).
  - backoff: initialMs 0, maxMs 0, factor 1 (no delay).
  - strategy: wave and quest both one_for_one.
  - escalation: every trigger "none" (a failing baseline/base branch only
    fails the individual agent, as at agent-runner.ts ~L561-575).
  Validation: numbers must be >= 0 (factor >= 1), enums must be one of the
  listed values; error messages follow the existing "config.x must be ..."
  style. Add tests/config-supervision.test.ts: defaults resolve to
  today's behaviour, invalid values throw, a config without the block
  validates unchanged.
