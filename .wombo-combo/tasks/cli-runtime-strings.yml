id: cli-runtime-strings
title: Extract launch, merge, daemon and status messages
description: |
  Route human text-mode messages of the runtime-control CLI commands through t() with
  keys in cli-runtime.json.

  Files owned by this task:
  - src/commands/launch.ts (about 27 console calls)
  - src/commands/merge.ts (about 18)
  - src/commands/retry.ts, src/commands/abort.ts, src/commands/resume.ts
  - src/commands/status.ts, src/commands/tui.ts
  - src/commands/citty/daemon.ts
  - src/commands/cleanup.ts (about 21)
  - Colocated or tests/ tests for these commands that assert on text output
  - src/locales/en/cli-runtime.json

  Rules: same as the other CLI tasks. Translate only the text-mode output branch.
  Never translate JSON/TOON output, IDs, branch names, file paths, error codes,
  citty descriptions, or flag help. Use t() from src/lib/i18n.ts. Plural keys for counts.

  Work:
  1. Keep English identical for every key.
  2. Confirm JSON output with `bun dev launch --dry-run --all-ready --output json` still
     matches the pre-change output.
  3. Typecheck, build, bun test, `graphify update .`.
