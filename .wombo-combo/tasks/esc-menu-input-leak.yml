id: esc-menu-input-leak
title: Gate screen input while the ESC menu is open
description: Screens such as task-browser and settings-screen keep handling keys (Enter/arrows) while the global ESC
  menu overlay is open, so menu selections also drive the screen underneath. quest-picker was gated via
  useEscMenu().open (dashboard-main-navigation); apply the same isActive gate to task-browser, settings-screen and other
  screens with useInput.
