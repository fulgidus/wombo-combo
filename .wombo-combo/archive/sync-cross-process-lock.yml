id: sync-cross-process-lock
title: "Sync: cross-process lock and duplicate-issue guard"
description: "Found by dogfooding (auto mode turned on, then 'woco sync run' while the daemon's sync loop ran): the CLI
  and the daemon created the same issues at the same moment, giving duplicate GitHub issues (#13/#15, #14/#16, #18/#19,
  #20/#21, #22/#23, #24/#25 on fulgidus/wombo-combo). The in-process single-flight lock does not cover separate
  processes, and marker lookup before create is racy. Fix both layers: (1) an advisory cross-process lock for every sync
  cycle and every item push/pull: a lock file .wombo-combo/sync/.lock (gitignored; add to .gitignore and the
  runtime-artifacts lists in AGENTS.md) created atomically (O_EXCL) with pid, host and timestamp, stale after 2 minutes
  or when the pid is dead on this host, waiting up to a few seconds then giving up with a warning, never blocking a woco
  command (src/lib/sync/cycle.ts, auto.ts, loop.ts, push.ts). (2) a duplicate guard in push: after createIssue, list
  issues carrying the same woco marker (listIssues state all); if more than one exists, keep the lowest number, adopt it
  in the mapping, and close the others with state_reason duplicate (extend UpdateIssueInput state_reason in
  src/lib/sync/github-client.ts to include 'duplicate', plus duplicate_of is not needed). Tests: two concurrent
  pushToGitHub calls against the fake server (tests/helpers/fake-github.ts) end with exactly one issue per task; stale
  lock is taken over; the guard closes a pre-existing duplicate. Update docs/src/content/docs/guides/github-sync.md
  (remove the 'rare race' limitation, describe the lock)."
